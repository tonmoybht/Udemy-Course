<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bankist</title>
    <!-- Favicon -->
    <link rel="shortcut icon" href="icon.png" type="image/x-icon" />
    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav>
      <p class="welcome">Log in to get started</p>
      <img src="logo.png" alt="logo" class="logo" />
      <input
        class="login-input login-input-user"
        type="text"
        placeholder="USER"
      />
      <input
        class="login-input login-input-pin"
        type="number"
        placeholder="PIN"
      />
      <button class="login-btn">&rarr;</button>
    </nav>
    <main>
      <!-- Balance -->
      <div class="balance">
        <div>
          <p class="balance-label">Current balance</p>
          <p class="balance-date">As of <span class="date">05/03/2037</span></p>
        </div>
        <div>
          <p class="balance-value">0000€</p>
        </div>
      </div>
      <div class="main-app">
        <!-- Movements -->
        <div class="movements-container">
          <div class="movements-row">
            <div class="movements">
              <p class="movements-type movements-type-deposit">2 Deposit</p>
              <p class="date"><span class="movements-date">05/03/2037</span></p>
            </div>
            <div class="movements-value">0000€</div>
          </div>
          <div class="movements-row">
            <div class="movements">
              <p class="movements-type movements-type-withdraw">1 Withdrawal</p>
              <p class="date"><span class="movements-date">05/03/2037</span></p>
            </div>
            <div class="movements-value">0000€</div>
          </div>
        </div>
        <!-- Transfer Money -->
        <div class="right-col">
          <div class="transfer-container">
            <p class="transfer-label">Transfer Money</p>
            <div class="transfer-input">
              <label for="transfer-to">Transfer To</label>
              <input
                id="transfer-to"
                class="form-input form-input-to"
                type="text"
              />
              <label for="amount-transfer">Amount</label>
              <input
                id="amount-transfer"
                class="form-input form-input-amount"
                type="number"
              />
              <button class="form-btn form-btn-transfer">&rarr;</button>
            </div>
          </div>
          <!-- Loan Money -->
          <div class="loan-container">
            <p class="loan-label">Request Loan</p>
            <div class="loan-input">
              <label for="loan-amount">Amount</label>
              <input
                id="loan-amount"
                class="form-input form-input-amount"
                type="number"
              />
              <button class="form-btn form-btn-loan">&rarr;</button>
            </div>
          </div>
          <!-- Close Account -->
          <div class="close-container">
            <p class="close-label">Close Account</p>
            <div class="close-input">
              <label for="close-user">USER</label>
              <input
                id="close-user"
                class="form-input form-input-user"
                type="text"
              />
              <label for="close-pin">PIN</label>
              <input
                id="close-pin"
                class="form-input form-input-pin"
                type="number"
              />
              <button class="form-btn form-btn-close">&rarr;</button>
            </div>
          </div>
        </div>
      </div>
      <!-- Summary -->
      <div class="summary-logout">
        <div class="summary">
          <p class="summary-label">IN</p>
          <p class="summary-value summary-value-in">0000€</p>
          <p class="summary-label">OUT</p>
          <p class="summary-value summary-value-out">0000€</p>
          <p class="summary-label">INTEREST</p>
          <p class="summary-value summary-value-interest">0000€</p>
          <button class="btn-sort">&darr; SORT</button>
        </div>
        <div class="logout-time">
          <p class="logout-label">
            You will be logged out in <span class="logout-timer">05:00</span>
          </p>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
